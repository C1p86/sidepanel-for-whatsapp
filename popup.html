<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>WhatsApp Side Panel Layout</title>
    <style>
      :root {
        color-scheme: light dark;
        font: 13px/1.4 system-ui, sans-serif;
      }
      body {
        width: 270px;
        margin: 0;
        padding: 12px;
        display: grid;
        gap: 10px;
      }
      label {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
      }
      input[type='number'] {
        width: 72px;
      }
      #status {
        padding: 8px;
        border-radius: 6px;
        background: rgba(128, 128, 128, 0.15);
      }
      #status.problem {
        background: rgba(220, 60, 60, 0.2);
      }
      #message {
        min-height: 1.4em;
        margin: 0;
      }
    </style>
  </head>
  <body>
    <label><span data-i18n="optEnabled"></span> <input id="enabled" type="checkbox" /></label>
    <label><span data-i18n="optThreshold"></span> <input id="threshold" type="number" min="300" max="2000" step="10" /></label>
    <label><span data-i18n="optShowNav"></span> <input id="showNav" type="checkbox" /></label>
    <div id="status" role="status"></div>
    <button id="diagnostics" type="button" data-i18n="copyDiagnostics"></button>
    <p id="message" role="alert"></p>
    <script src="popup.js"></script>
  </body>
</html>
