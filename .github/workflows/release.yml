name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check that the tag matches the manifest version
        run: |
          version="$(jq -r .version manifest.json)"
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match manifest version $version" >&2
            exit 1
          fi

      - name: Build the extension zip
        run: >
          zip -r "sidepanel-for-whatsapp-$GITHUB_REF_NAME.zip" .
          -x '.git/*' '.github/*' 'docs/*' 'scripts/*' 'README.md'

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "$GITHUB_REF_NAME"
          "sidepanel-for-whatsapp-$GITHUB_REF_NAME.zip"
          --verify-tag --generate-notes
